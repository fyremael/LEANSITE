name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
      - name: Build
        run: lake build
      - name: Validate example site
        run: lake exe vibesite check
      - name: Run VibeSite regression tests
        run: lake exe vibesite_tests
