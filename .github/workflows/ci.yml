name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Lean
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          lake build 2>&1 | tee build.log
      - name: Preserve build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lean-build-log
          path: build.log
      - name: Validate example site
        run: lake exe leansite check
      - name: Run LeanSite regression tests
        run: lake exe leansite_tests
