name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Lean
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
      - name: Build LeanSite
        run: lake build
      - name: Validate example site
        run: lake exe leansite check
      - name: Run regression tests
        run: lake exe leansite_tests
      - name: Generate site
        run: lake exe leansite build
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload generated site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy LeanSite demo
        id: deployment
        uses: actions/deploy-pages@v4
